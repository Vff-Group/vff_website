{% extends 'base.html' %}

{% block title %}404 | Velvet Wash{% endblock %}

{% block content %}
<section class="lw-section">
  <div class="container lw-404">
    <div class="lw-404__code">404</div>
    <h1 class="h2 mb-2">Page Not Found</h1>
    <p class="mb-4" style="color:var(--lw-text-muted);max-width:28rem;margin-left:auto;margin-right:auto;">The page you're looking for doesn't exist or was moved.</p>
    <img src="{{ img.404 }}" alt="Laundry basket" loading="lazy" style="max-width:260px;border-radius:16px;" />
    <div class="mt-4">
      <a href="{% url 'website_app:index' %}" class="lw-btn lw-btn-primary">Go Home</a>
      <a href="{% url 'website_app:contactus' %}" class="lw-btn lw-btn-outline ms-2">Contact Us</a>
    </div>
  </div>
</section>
{% endblock %}
