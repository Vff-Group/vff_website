<section class="lw-section lw-video-showcase lw-reveal">
  <div class="container">
    <div class="lw-section__head">
      <span class="lw-section__label">Velvet Wash in action</span>
      <h2 class="lw-section__title">{{ showcase_title|default:"See our world-class laundry operations" }}</h2>
      <p class="lw-section__desc">{{ showcase_desc|default:"Professional equipment, hygiene standards, and care — the experience every VFF Group customer receives." }}</p>
    </div>
    <div class="lw-video-grid lw-stagger">
      <div class="lw-video-card">
        <video muted loop playsinline preload="none" data-src="{{ vff_video_1 }}"></video>
      </div>
      <div class="lw-video-card">
        <video muted loop playsinline preload="none" data-src="{{ vff_video_2 }}"></video>
      </div>
      <div class="lw-video-card">
        <video muted loop playsinline preload="none" data-src="{{ vff_video_3 }}"></video>
      </div>
      <div class="lw-video-card">
        <video muted loop playsinline preload="none" data-src="{{ vff_video_4 }}"></video>
      </div>
    </div>
  </div>
</section>
